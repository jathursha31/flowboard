# ✅ CI: GitHub la code push pannumbodhellaam tests thaane oadum
name: CI

on:
  push:
  pull_request:

jobs:
  server:
    name: Server (API tests + TypeScript)
    runs-on: ubuntu-latest
    # 🗃️ Test ku thani MongoDB (Atlas venaam, unga unmaiyaana data ah thodaadhu)
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: server
    env:
      MONGODB_URI: mongodb://localhost:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  website:
    name: Website (tests + TypeScript + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flowboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
