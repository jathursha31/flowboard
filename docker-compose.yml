# 🐳 Oru command la full app: docker compose up --build
# → http://localhost:3001 (website + API + /admin), MongoDB um container la (internet / Atlas theva illa)
#
# Atlas use pannanum na: keezha "MONGODB_URI" line ah eduthudunga (server/.env la irukkuradhu use aagum)

services:
  app:
    build: .
    ports:
      - '3001:3001'
    env_file:
      - server/.env # ADMIN_PASSWORD, optional keys (git la pogaadhu)
    environment:
      MONGODB_URI: mongodb://mongo:27017/?directConnection=true
      APP_URL: http://localhost:3001
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db # container azhinjaalum data irukkum
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo-data:
